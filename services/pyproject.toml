[project]
name = "ainexus"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
auth = [
    "alembic==1.20.0",
    "dishka==1.10.1",
    "fastapi==0.141.1",
    "gunicorn==26.2.0",
    "orjson==3.12.0",
    "sqlalchemy==2.0.54",
]
lint = ["pyrefly==1.3.1", "ruff==0.16.8"]


[tool.pyrefly]
project-includes = ["auth"]
project-excludes = ["**/__pycache__", "**/.venv"]
search-path = ["auth"]
python-version = "3.12"
preset = "strict"

[tool.ruff]
target-version = "py312"
line-length = 92
src = ["auth"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
