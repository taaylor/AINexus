[project]
name = "ainexus"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"

[dependency-groups]
auth = [
    "alembic==1.20.0",
    "anyio==4.15.1",
    "dishka==1.10.1",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "orjson==3.12.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "psycopg[binary]==3.3.6",
    "uuid7==0.1.0",
    "greenlet==3.5.6",
    "loguru==0.7.3",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.15.1",
]
lint = ["pre-commit==4.6.2", "pyrefly==1.3.1", "ruff==0.16.8"]
tests = [
    "faker==37.1.0",
    "faker-file[pptx]==0.18.4",
    "freezegun==1.5.1",
    "httpx2==2.13.1",
    "polyfactory==2.21.0",
    "pydantic-marshals[assert-contains]==0.3.19",
    "pytest==8.3.5",
    "pytest-cov==6.1.1",
    "pytest-lazy-fixtures==1.4.0",
    "respx==0.22.0",
    "rstr==3.2.2",
]


[tool.pyrefly]
project-includes = ["services/"]
search-path = ["services"]
project-excludes = ["**/__pycache__", "**/.venv"]
python-version = "3.12"
preset = "strict"

[tool.ruff]
target-version = "py312"
line-length = 92

[tool.ruff.lint]
select = [
    "BLE",
    "C90",
    "E",
    "F",
    "G",
    "I",
    "ICN",
    "ISC",
    "PLE",
    "Q",
    "RUF006",
    "RUF100",
    "T10",
    "T20",
    "TID",
    "UP",
    "W",
]
ignore = ["E501", "RUF001"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
