default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
        types: [python]
      - id: fix-byte-order-marker
      - id: fix-encoding-pragma
        args: [--remove]
      - id: mixed-line-ending
        args: [--fix=lf]
        types: [python]
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --group lint ruff check --fix services/auth --config pyproject.toml
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --group lint ruff format services/auth
        language: system
        pass_filenames: false

      - id: pyrefly
        name: pyrefly
        entry: make check-types
        language: system
        pass_filenames: false
