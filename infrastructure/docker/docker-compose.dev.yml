name: ainexus-dev

x-restart: &x-restart-svc
  restart: on-failure

services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.22.0
    ports:
      - '127.0.0.1:16686:16686'
      - '127.0.0.1:4317:4317'
    <<: *x-restart-svc

  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    depends_on:
      - postgres
      - redis
      - jaeger
    environment:
      TRACE: "true"
      TRACE_OTLP_ENDPOINT: http://jaeger:4317
      TRACE_INSECURE: "true"
      POSTGRES_HOST: postgres
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      REDIS_HOST: redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1GB
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    depends_on:
      - auth
    volumes:
      - ../nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../nginx/conf.d:/usr/local/openresty/nginx/conf/conf.d:ro
      - ../nginx/lua:/etc/nginx/lua:ro
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - '127.0.0.1:80:80'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512M

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: "password"
      POSTGRES_USER: "username"
      POSTGRES_DB: "database"
    ports:
      - '127.0.0.1:5432:5432'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 2GB
    shm_size: 256mb
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - '127.0.0.1:6379:6379'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: 256M
