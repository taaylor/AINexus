name: ainexus-dev

include:
  - path: docker-compose.metrics.yml

x-restart: &x-restart-svc
  restart: on-failure

services:
  pgbouncer:
    image: pgbouncer/pgbouncer:1.25.2
    env_file:
      - ../pgbouncer/pgbouncer.env
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: "5432"
      DATABASES_USER: ${POSTGRES_USER:-username}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      DATABASES_DBNAME: ${POSTGRES_DB:-database}
      DATABASES_CLIENT_SIDE_DBNAME: ${POSTGRES_DB:-database}
      PGBOUNCER_ADMIN_USERS: ${POSTGRES_USER:-username}
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "nc -w 1 127.0.0.1 6432 </dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *x-restart-svc

  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      jaeger:
        condition: service_started
      pgbouncer:
        condition: service_healthy
    environment:
      TRACE: "true"
      TRACE_OTLP_ENDPOINT: http://jaeger:4317
      TRACE_INSECURE: "true"
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DATABASE: ${POSTGRES_DB:-database}
      POSTGRES_PGBOUNCER_HOST: pgbouncer
      POSTGRES_PGBOUNCER_PORT: "6432"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      REDIS_HOST: redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      POSTGRES_POOL_SIZE: 50
      POSTGRES_MAX_POOL_SIZE: 10
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1GB
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    depends_on:
      - auth
    volumes:
      - ../nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ../nginx/conf.d:/usr/local/openresty/nginx/conf/conf.d:ro
      - ../nginx/lua:/etc/nginx/lua:ro
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      REDIS_HOST: redis
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - '127.0.0.1:80:80'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1GB

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_DB: ${POSTGRES_DB:-database}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-postgres_exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-${POSTGRES_PASSWORD:-password}}
    ports:
      - '127.0.0.1:5432:5432'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 4GB
    shm_size: 512mb
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ../postgres/create-exporter-role.sh:/docker-entrypoint-initdb.d/20-exporter-role.sh:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-password}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
    ports:
      - '127.0.0.1:6379:6379'
    <<: *x-restart-svc
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 512MB

volumes:
  pgdata:
