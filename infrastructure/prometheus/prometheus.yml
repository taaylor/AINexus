global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - auth:8000

  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: postgres-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
