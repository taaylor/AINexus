upstream auth_service {
    server auth:8000;
}

upstream prometheus_ui {
    server prometheus:9090;
}

upstream jaeger_ui {
    server jaeger:16686;
}

server {
    listen 80;
    server_name _;

    location = /prometheus {
        return 301 /prometheus/;
    }

    location ^~ /prometheus/ {
        auth_basic "Prometheus";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://prometheus_ui/;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /prometheus;
    }

    location = /jaeger {
        return 301 /jaeger/;
    }

    location ^~ /jaeger/ {
        auth_basic "Jaeger";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://jaeger_ui/;
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /jaeger;
    }

    location ^~ /api/auth-service/protected/ {
        access_by_lua_file /etc/nginx/lua/jwt.lua;

        proxy_pass http://auth_service;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?:api/auth-service/|auth-service/docs(?:/|$)) {
        proxy_pass http://auth_service;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type application/json;
        return 404 '{"detail": "Not found"}';
    }
}
